general = {
    name = "Yuzuki Chameleon";
    output_backend = "alsa";
    mdns_backend = "tinysvcmdns";
    interpolation = "basic";
    ignore_volume_control = "no";
    volume_control_profile = "flat";
    volume_range_db = 30;
};

latencies = {
    default = 11025;
};

metadata = {
    enabled = "yes";
    include_cover_art = "yes";
    pipe_name = "/tmp/shairport-sync-metadata";
    pipe_timeout = 5000;
};

alsa = {
    output_device = "airplay";
    output_rate = 44100;
    output_format = "S16_LE";
    period_size = 1024;
    buffer_size = 4096;
    disable_synchronization = "yes";
    disable_standby_mode = "always";
};
